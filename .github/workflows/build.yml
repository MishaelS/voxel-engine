# Release builds for macOS, Windows and Linux (BUILDING.md). Optional: the
# same builds are made locally by tools/build.sh all (with Docker running).
# On a tag v* (and by hand: Actions > Build > Run workflow): the native
# library (native/, CMake + godot-cpp) on macOS and, in Docker, for Windows
# and Linux, then one Linux job exports every preset of export_presets.cfg
# with tools/build.sh, uploads the zips as artifacts and, for a tag,
# attaches them to a GitHub Release.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # The Godot the project is made with (Godot --version): 4.5.1.stable.
  GODOT_VERSION: "4.5.1"
  GODOT_STATUS: "stable"

jobs:
  native:
    name: Native library (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            args: macos
            files: bin/libvoxel_native.framework
          # Windows (MinGW) and Linux x86_64/arm64 in Docker, the same image
          # as a local build (native/docker/Dockerfile, Ubuntu 20.04 glibc).
          - name: windows-linux
            os: ubuntu-latest
            args: --docker windows linux linux-arm64
            files: |
              bin/voxel_native.windows.x86_64.dll
              bin/libvoxel_native.linux.x86_64.so
              bin/libvoxel_native.linux.arm64.so
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          tools/build.sh --native-only ${{ matrix.args }}
          ls -la bin
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  export:
    name: Export
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Native libraries into bin/
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts
      - name: Place native libraries
        run: |
          rm -rf bin/libvoxel_native.framework
          mkdir -p bin/libvoxel_native.framework
          cp -R native-artifacts/native-macos/. bin/libvoxel_native.framework/
          cp native-artifacts/native-windows-linux/* bin/
          rm -rf native-artifacts
          find bin -type f | sort

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}
      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          tag="${GODOT_VERSION}-${GODOT_STATUS}"
          base="https://github.com/godotengine/godot/releases/download/$tag"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${tag}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${tag}_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${tag}_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          mkdir -p "$dest"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$dest/"
          rm -rf /tmp/godot.zip /tmp/templates.tpz /tmp/templates
          ls "$dest"

      - name: Export every platform
        run: GODOT=~/godot/godot tools/build.sh --no-native all

      - uses: actions/upload-artifact@v4
        with:
          name: voxel-engine-builds
          path: build/*/*.zip
          if-no-files-found: error
          compression-level: 0
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*/*.zip
          generate_release_notes: true
